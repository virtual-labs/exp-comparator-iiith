<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" font-family="Arial, Helvetica, sans-serif">
  <title>2-bit comparator using a subtractor built from two full adders</title>
  <rect width="700" height="450" fill="#ffffff"/>

  <!-- inputs -->
  <g font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="170" y="28">A1</text>
    <text x="430" y="28">A0</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="215" y="28">B1</text>
    <text x="475" y="28">B0</text>
  </g>

  <g fill="none" stroke="#000000" stroke-width="2">
    <!-- A1 and A0 go straight down into the adders -->
    <line x1="170" y1="36" x2="170" y2="210"/>
    <line x1="430" y1="36" x2="430" y2="210"/>
    <!-- B1 and B0 go into the XOR gates -->
    <line x1="215" y1="36" x2="215" y2="108"/>
    <line x1="475" y1="36" x2="475" y2="108"/>
    <!-- Cin (logic 1) stubs into the XOR gates -->
    <line x1="245" y1="80" x2="245" y2="108"/>
    <line x1="505" y1="80" x2="505" y2="108"/>
    <!-- XOR outputs (inverted B) into the adders -->
    <line x1="230" y1="146" x2="230" y2="210"/>
    <line x1="490" y1="146" x2="490" y2="210"/>
    <!-- Cin (logic 1) into the adder of stage 0 -->
    <line x1="550" y1="240" x2="610" y2="240"/>
    <!-- carry C0 from stage 0 to stage 1 -->
    <line x1="400" y1="240" x2="290" y2="240"/>
    <!-- carry out of stage 1 -->
    <line x1="140" y1="240" x2="90" y2="240"/>
    <!-- sums -->
    <line x1="215" y1="270" x2="215" y2="320"/>
    <line x1="475" y1="270" x2="475" y2="320"/>
  </g>

  <!-- XOR gates -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="195" y="108" width="70" height="38" rx="6"/>
    <rect x="455" y="108" width="70" height="38" rx="6"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="230" y="132">XOR</text>
    <text x="490" y="132">XOR</text>
  </g>

  <!-- full adders -->
  <g fill="#cfe8fb" stroke="#000000" stroke-width="2">
    <rect x="140" y="210" width="150" height="60" rx="6"/>
    <rect x="400" y="210" width="150" height="60" rx="6"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="215" y="236">Full Adder</text>
    <text x="215" y="256" font-weight="normal" font-size="13">stage 1 (MSB)</text>
    <text x="475" y="236">Full Adder</text>
    <text x="475" y="256" font-weight="normal" font-size="13">stage 0 (LSB)</text>
  </g>

  <!-- pin names on the adders -->
  <g font-size="11" fill="#333333">
    <text x="175" y="224">A</text>
    <text x="235" y="224">B</text>
    <text x="435" y="224">A</text>
    <text x="495" y="224">B</text>
    <text x="294" y="256">Cin</text>
    <text x="368" y="256">Cout</text>
    <text x="521" y="256">Cin</text>
    <text x="145" y="256">Cout</text>
    <text x="219" y="284">Sum</text>
    <text x="479" y="284">Sum</text>
  </g>

  <!-- net names -->
  <g font-size="15" fill="#000000" text-anchor="middle">
    <text x="245" y="74">Cin = 1</text>
    <text x="505" y="74">Cin = 1</text>
    <text x="640" y="245">Cin = 1</text>
    <text x="345" y="232">C0</text>
    <text x="60" y="246" font-weight="bold">C1</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="215" y="340">S1</text>
    <text x="475" y="340">S0</text>
  </g>
  <g font-size="13" fill="#444444" text-anchor="middle">
    <text x="230" y="168">B1'</text>
    <text x="490" y="168">B0'</text>
  </g>

  <!-- comparison logic -->
  <text x="350" y="372" font-size="14" fill="#444444" text-anchor="middle">Comparison logic (from S1, S0 and C1)</text>
  <g fill="#fff4cc" stroke="#000000" stroke-width="2">
    <rect x="30" y="384" width="190" height="46" rx="6"/>
    <rect x="255" y="384" width="190" height="46" rx="6"/>
    <rect x="480" y="384" width="190" height="46" rx="6"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="125" y="412">A &lt; B = C1'</text>
    <text x="350" y="412">A = B = S1' · S0'</text>
    <text x="575" y="412">A &gt; B = C1 · (S1 + S0)</text>
  </g>
</svg>
